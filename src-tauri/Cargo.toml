[package]
name = "gitolotl"
version = "0.2.4"
description = "Gitolotl - a friendly, secure Git client by CodeMushroom"
authors = ["CodeMushroom"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "gitolotl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
