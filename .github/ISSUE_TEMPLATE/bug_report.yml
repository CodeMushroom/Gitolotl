name: Bug report
description: Something in Gitolotl is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with…
        2. Click…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gitolotl version
      description: Shown in Settings (the gear icon).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple silicon), macOS (Intel), Linux]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: Git version
      description: Also shown in Settings, or run `git --version`.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages or screenshots. Please remove anything private first.
