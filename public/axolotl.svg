<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4654"/>
      <stop offset="1" stop-color="#0c222b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd0e2"/>
      <stop offset="1" stop-color="#ff9fc4"/>
    </linearGradient>
    <g id="gill">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" fill="none" stroke="#e23f7c" stroke-width="30" stroke-linecap="round"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" fill="none" stroke="#e23f7c" stroke-width="13" stroke-linecap="round"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" fill="none" stroke="#ff7fae" stroke-width="10" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- bubbles -->
  <circle cx="92" cy="96" r="12" fill="none" stroke="#3f7f90" stroke-width="5"/>
  <circle cx="126" cy="62" r="7" fill="none" stroke="#3f7f90" stroke-width="4"/>
  <circle cx="420" cy="86" r="9" fill="none" stroke="#3f7f90" stroke-width="4"/>
  <!-- gills -->
  <g transform="translate(138 250)">
    <use href="#gill" transform="rotate(34)"/>
    <use href="#gill" transform="rotate(4)"/>
    <use href="#gill" transform="rotate(-28)"/>
  </g>
  <g transform="translate(374 250) scale(-1 1)">
    <use href="#gill" transform="rotate(34)"/>
    <use href="#gill" transform="rotate(4)"/>
    <use href="#gill" transform="rotate(-28)"/>
  </g>
  <!-- head -->
  <ellipse cx="256" cy="286" rx="162" ry="128" fill="url(#skin)"/>
  <ellipse cx="256" cy="232" rx="110" ry="46" fill="#ffe3ee" opacity=".55"/>
  <!-- git branch freckle -->
  <g fill="none" stroke="#f0649a" stroke-width="7" stroke-linecap="round">
    <path d="M240 196 v40 M240 222 c0 -12 30 -6 30 -20"/>
  </g>
  <g fill="#f0649a">
    <circle cx="240" cy="192" r="8"/><circle cx="240" cy="240" r="8"/><circle cx="270" cy="198" r="8"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="150" cy="322" rx="30" ry="18" fill="#ff7fae" opacity=".7"/>
  <ellipse cx="362" cy="322" rx="30" ry="18" fill="#ff7fae" opacity=".7"/>
  <!-- eyes -->
  <circle cx="170" cy="282" r="23" fill="#1d1420"/>
  <circle cx="342" cy="282" r="23" fill="#1d1420"/>
  <circle cx="178" cy="273" r="8" fill="#fff"/>
  <circle cx="350" cy="273" r="8" fill="#fff"/>
  <circle cx="163" cy="291" r="4" fill="#fff" opacity=".8"/>
  <circle cx="335" cy="291" r="4" fill="#fff" opacity=".8"/>
  <!-- smile -->
  <path d="M200 318 Q256 362 312 318" fill="none" stroke="#1d1420" stroke-width="9" stroke-linecap="round"/>
</svg>
